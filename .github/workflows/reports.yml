name: Mozilla history reports

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate reports without pushing (still creates Taskcluster probes)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mozilla-history-reports
  cancel-in-progress: false

jobs:
  reports:
    # Every repository must opt in to scheduling. Manual runs are always available.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_REPORTS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      TASKCLUSTER_ROOT_URL: https://firefox-ci-tc.services.mozilla.com/
      REPORT_SCHEDULER_ID: smoketest
      REPORT_PREFIX: https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/WorkerVersions/
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate publishing branch
        run: |
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Publishing is only allowed from the default branch.' >&2
            exit 1
          fi
      - name: Test and build tools
        run: |
          go test ./...
          python3 -m unittest test_fetch_and_generate.py
          go build -o "$RUNNER_TEMP/mozilla-history" .
          go build -o "$RUNNER_TEMP/audit-worker-versions" ./audit-worker-versions
      - name: Generate configuration and worker reports
        env:
          TASKCLUSTER_CLIENT_ID: ${{ secrets.TASKCLUSTER_CLIENT_ID }}
          TASKCLUSTER_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_ACCESS_TOKEN }}
        run: |
          : "${TASKCLUSTER_CLIENT_ID:?Set the TASKCLUSTER_CLIENT_ID repository secret}"
          : "${TASKCLUSTER_ACCESS_TOKEN:?Set the TASKCLUSTER_ACCESS_TOKEN repository secret}"
          "$RUNNER_TEMP/mozilla-history"
          "$RUNNER_TEMP/audit-worker-versions" | tee "$RUNNER_TEMP/probes.log"
          task_group_id=$(sed -n 's/^Task Group ID: //p' "$RUNNER_TEMP/probes.log")
          [[ "$task_group_id" =~ ^[A-Za-z0-9_-]{22}$ ]]
          echo "Task group: $task_group_id" >> "$GITHUB_STEP_SUMMARY"
          echo 'Waiting 90 minutes for worker probes.'
          sleep 5400
          "$RUNNER_TEMP/audit-worker-versions" "$task_group_id"
      - name: Commit snapshots and rebuild history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Clients can be absent when there are no visible clients.
          for directory in Clients Hooks Roles WorkerPools WorkerVersions; do
            if [[ -d "$directory" ]] || git ls-files --error-unmatch "$directory" >/dev/null 2>&1; then
              git add -A -- "$directory"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update Taskcluster reports ($(date -u +%Y-%m-%d))"
          fi
          # History must include the snapshot committed immediately above.
          ./build-docs-history.sh
          git add -- docs/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update worker version history'
          fi
          git diff --stat "$GITHUB_SHA" HEAD >> "$GITHUB_STEP_SUMMARY"
          git diff --binary "$GITHUB_SHA" HEAD > "$RUNNER_TEMP/reports.patch"
      - name: Upload reviewable report changes
        uses: actions/upload-artifact@v4
        with:
          name: report-changes
          path: ${{ runner.temp }}/reports.patch
      - name: Publish reports
        if: env.DRY_RUN != 'true'
        run: |
          # A normal push rejects concurrent remote changes; never force or rebase stale reports.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Record outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Report job: $RESULT. Dry run: $DRY_RUN." >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: reports
    if: vars.PUBLISH_REPORT_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
