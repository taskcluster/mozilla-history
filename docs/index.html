<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefox-CI Workers Versions History</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown-light.min.css"
    integrity="sha512-zb2pp+R+czM7GAemdSUQt6jFmr3qCo6ikvBgVU6F5GvwEDR0C2sefFiPEJ9QUpmAKdD5EqDUdNRtbOYnbF/eyQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://cdn.jsdelivr.net/gh/tofsjonas/sortable/sortable-base.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
    }

    main {
      margin: 20px 0;
    }

    .report-layout {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .content-column {
      min-width: 0;
      box-sizing: border-box;
      padding-right: 40px;
    }

    .toc {
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      box-sizing: border-box;
      padding: 0 20px 12px 40px;
      border-right: 1px solid #d0d7de;
    }

    .toc-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
    }

    .toc-title {
      padding-top: 16px;
      font-size: 16px;
      font-weight: 700;
    }

    .toc-title::after {
      display: block;
      width: 100%;
      margin-top: 8px;
      border-bottom: 2px solid #d0d7de;
      content: "";
    }

    .toc-toggle {
      flex: none;
      display: inline-flex;
      width: 32px;
      height: 32px;
      padding: 0;
      align-items: center;
      justify-content: center;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      color: #24292f;
      font: inherit;
      cursor: pointer;
    }

    .toc-toggle svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .toc-toggle .toc-expand-icon,
    .toc-toggle[aria-expanded="false"] .toc-collapse-icon {
      display: none;
    }

    .toc-toggle[aria-expanded="false"] .toc-expand-icon {
      display: block;
    }

    .report-layout:not(.toc-collapsed) .toc-toggle {
      margin-top: 11px;
    }

    .toc-toggle:hover {
      background: #eef1f4;
    }

    .toc-toggle:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    .report-layout.toc-collapsed {
      grid-template-columns: 32px minmax(0, 1fr);
      column-gap: 16px;
      padding-left: 20px;
    }

    .report-layout.toc-collapsed .toc {
      width: 32px;
      top: 31px;
      padding: 0;
      overflow: visible;
      border-right: 0;
    }

    .report-layout.toc-collapsed .toc-title {
      display: none;
    }

    .report-layout.toc-collapsed .toc-header {
      padding-bottom: 0;
    }

    .report-layout.toc-collapsed .content-column {
      padding-left: 20px;
    }

    @media screen and (max-width: 900px) {
      main {
        margin: 16px;
      }

      .report-layout,
      .report-layout.toc-collapsed {
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
        padding-left: 0;
      }

      .report-layout .toc {
        position: static;
        width: 100%;
        margin-left: 0;
        max-height: none;
        overflow: visible;
        padding: 0 0 12px;
        border-right: 0;
        border-bottom: 1px solid #d0d7de;
      }

      .toc-title {
        padding-top: 6px;
      }

      .report-layout.toc-collapsed .toc {
        width: 32px;
        top: auto;
        padding: 0;
        border-bottom: 0;
      }

      .report-layout .content-column,
      .report-layout.toc-collapsed .content-column {
        padding-right: 0;
        padding-left: 0;
      }
    }

    .toc ul {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
    }

    .toc ul ul {
      margin-top: 3px;
      padding-left: 12px;
    }

    .toc li + li {
      margin-top: 4px;
    }

    .toc li li + li {
      margin-top: 2px;
    }

    .toc a {
      color: #24292f;
      line-height: 1.35;
      text-decoration: none;
    }

    .toc > ul > li > a {
      font-weight: 600;
    }

    .toc ul ul a {
      color: #57606a;
      font-size: 0.92em;
    }

    @media screen and (min-width: 901px) {
      .toc a {
        white-space: nowrap;
      }
    }

    .heading-permalink {
      margin-left: 0.35em;
      color: #57606a;
      font-size: 0.75em;
      font-weight: 400;
      opacity: 0.35;
      text-decoration: none;
    }

    h2:hover > .heading-permalink,
    h3:hover > .heading-permalink,
    .heading-permalink:hover,
    .heading-permalink:focus-visible {
      opacity: 1;
    }

    .heading-permalink:hover {
      color: #0969da;
      text-decoration: none;
    }

    .heading-permalink:focus-visible {
      outline: 2px solid #0969da;
      outline-offset: 2px;
    }

    @media (hover: none) {
      .heading-permalink {
        opacity: 0.65;
      }
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .history {
      margin-top: 20px;
    }

    .graphs {
      margin-top: 40px;
      border-top: 1px solid #eee;
      padding-top: 30px;
    }

    .info {
      padding: 8px 2px;
      color: #555;
      font-size: 14px;
      width: 70%;
    }

    .stale-probe-notice {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0 1rem;
      background: #fff8e6;
      border: 1px solid #e6cb83;
      border-radius: 6px;
      color: #684b10;
    }

    .source {
      margin: 0 0 10px;
      color: inherit;
      font-size: inherit;
    }

    .source span + span::before {
      content: " · ";
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin: 12px 0;
      font-size: 14px;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls .hint,
    .tu-filter-count {
      color: #656d76;
    }

    .error {
      padding: 12px 16px;
      border: 1px solid #ffb8b8;
      border-left-width: 4px;
      background: #fff5f5;
    }

    .tu-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    .tu-filter input {
      padding: 5px 10px;
      min-width: 260px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font: inherit;
    }

    /* Cell shading by pool count. Declared before the hover rules below so the
       crosshair still reads clearly over a shaded column. */
    .tu-heat-1 { background-color: #f2f9f4; }
    .tu-heat-2 { background-color: #ddefe2; }
    .tu-heat-3 { background-color: #c2e2cb; }
    .tu-heat-4 { background-color: #a3d4b1; }
    .tu-heat-5 { background-color: #7cc294; }

    /* Big-table helpers, driven by the .tu-* classes table-utils.js adds. */

    /* github-markdown-css renders tables as display:block with overflow:auto,
       which makes each table its own scroll box and defeats position:sticky.
       Undoing it keeps the page as the only scroller. */
    .markdown-body table.tu-sticky {
      display: table;
      width: max-content;
      max-width: none;
      overflow: visible;
    }

    /* Sticky cells need an opaque background, and box-shadow borders because
       collapsed table borders are not painted for sticky cells. */
    .tu-sticky thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background-color: #f6f8fa;
      box-shadow: inset 0 -1px 0 #d0d7de;
    }

    .tu-sticky tbody td:first-child,
    .tu-sticky tbody th:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      background-color: #fff;
      box-shadow: inset -1px 0 0 #d0d7de;
      white-space: nowrap;
    }

    .tu-sticky thead th:first-child {
      left: 0;
      z-index: 3;
    }

    /* Hovered row and hovered column. Declared after the sticky rules, and
       with enough specificity, to also win on the frozen first column. */
    .tu-crosshair tbody tr:hover > td,
    .tu-crosshair tbody tr:hover > th,
    .tu-crosshair tbody tr:hover > td:first-child,
    .tu-crosshair tbody tr:hover > th:first-child,
    .tu-crosshair td.tu-col,
    .tu-crosshair td.tu-col:first-child {
      background-color: #eef4fb;
    }

    /* The hovered cell itself, and the hovered column's header. */
    .tu-crosshair tbody td:hover,
    .tu-crosshair thead th.tu-col {
      background-color: #dbe8f7;
    }
  </style>
</head>

<body>

  <div class="markdown-body">
    <main id="report-layout" class="report-layout">
      <nav id="toc" class="toc" aria-label="Table of contents">
        <div class="toc-header">
          <strong class="toc-title">Contents</strong>
          <button id="toc-toggle" class="toc-toggle" type="button" aria-expanded="true"
            aria-controls="toc-list" aria-label="Collapse table of contents"
            title="Collapse table of contents">
            <svg class="toc-collapse-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M10.8 2.7a1 1 0 0 1 0 1.4L6.9 8l3.9 3.9a1 1 0 1 1-1.4 1.4L4.8 8.7a1 1 0 0 1 0-1.4l4.6-4.6a1 1 0 0 1 1.4 0Z"/>
            </svg>
            <svg class="toc-expand-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M5.2 2.7a1 1 0 0 0 0 1.4L9.1 8l-3.9 3.9a1 1 0 1 0 1.4 1.4l4.6-4.6a1 1 0 0 0 0-1.4L6.6 2.7a1 1 0 0 0-1.4 0Z"/>
            </svg>
          </button>
        </div>
        <ul id="toc-list"></ul>
      </nav>
      <div class="content-column">
        <div class="content" id="content"></div>
        <div class="history" id="history-content"></div>
        <div class="graphs" id="graphs-content">
          <h2>Graphs</h2>
          <p class="info">Each point shows the number of worker pools observed in a snapshot.</p>
          <p class="info" id="graph-status">Loading charts&hellip;</p>
          <h3>Worker pools by implementation</h3>
          <div id="graph-implementations"></div>
          <h3>Worker pools by version</h3>
          <div id="graph-versions"></div>
        </div>
      </div>
    </main>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"
    integrity="sha512-LhccdVNGe2QMEfI3x4DVV3ckMRe36TfydKss6mJpdHjNFiV07dFpS2xzeZedptKZrwxfICJpez09iNioiSZ3hA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/gh/tofsjonas/sortable/sortable.min.js"></script>
  <script type="module">
    import { decorateSortableTables } from './table-sort.js'
    import { enhanceTables } from './table-utils.js'
    import { staleProbeAge } from './report-freshness.js'

    // Resolve against the directory, so both /<repo>/ and /<repo>/index.html work.
    const baseUrl = new URL('.', window.location.href)
    // On GitHub Pages the first path segment is the repository name. Quick and
    // local previews use /docs/, so fall back to mozilla-history there.
    const pathRepo = baseUrl.pathname.split('/').filter(Boolean)[0] || ''
    const repo = pathRepo.endsWith('-history') ? pathRepo : 'mozilla-history'
    const query = new URLSearchParams(window.location.search)
    const loopbackHost = ['127.0.0.1', 'localhost', '[::1]'].includes(window.location.hostname)
    const bundledReport = query.has('local') || (
      !query.has('remote') && (
        loopbackHost || window.location.hostname.endsWith('.quick.mozilla.cloud') ||
        (window.location.hostname.endsWith('.github.io') && baseUrl.pathname.endsWith('/docs/'))
      )
    )
    const reportBaseUrl = bundledReport
      ? new URL('../WorkerVersions/', baseUrl)
      : new URL(`https://raw.githubusercontent.com/taskcluster/${repo}/master/WorkerVersions/`)
    const readmeUrl = new URL('README.md', reportBaseUrl)
    const workersUrl = new URL('workers.json', reportBaseUrl)
    const historyUrl = new URL('history.json', baseUrl)
    const plotlyUrl = 'https://cdn.plot.ly/plotly-2.18.0.min.js'

    // Columns are sorted newest version first; everything past this many is
    // folded into a single "older" column so the table stays readable.
    const MAX_VERSION_COLUMNS = 25
    // Versions charted individually; the rest are summed into one trace.
    const CHARTED_VERSIONS = 10
    const HEAT_STEPS = 5
    const TOC_STORAGE_KEY = 'mozilla-history:toc-collapsed'
    const RANGES = [
      { id: '1y', label: 'Last year', days: 365 },
      { id: '3y', label: 'Last 3 years', days: 3 * 365 },
      { id: 'all', label: 'Everything', days: Infinity },
    ]

    const versionCollator = new Intl.Collator('en', { numeric: true, sensitivity: 'base' })

    let history = null
    let rangeId = '1y'
    let showAllVersions = false
    let plotly = null

    function compareVersionsDescending(a, b) {
      const aIsVersion = /^v?\d/i.test(a.trim())
      const bIsVersion = /^v?\d/i.test(b.trim())
      if (aIsVersion !== bIsVersion) return aIsVersion ? -1 : 1
      return versionCollator.compare(b, a)
    }

    async function fetchOk(url) {
      // These reports are replaced at stable URLs. Always revalidate so a
      // newly deployed page cannot be paired with a stale cached snapshot.
      const res = await fetch(url, { cache: 'no-cache' })
      if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`)
      return res
    }

    function showError(container, what, error) {
      console.error(`Failed to load ${what}`, error)
      const el = document.createElement('p')
      el.className = 'error'
      el.innerHTML = `<strong>Could not load ${what}.</strong> ${error.message}` +
        ' &mdash; try reloading; the rest of the page is unaffected.'
      container.replaceChildren(el)
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const el = document.createElement('script')
        el.src = src
        el.onload = resolve
        el.onerror = () => reject(new Error(`could not load ${src}`))
        document.head.appendChild(el)
      })
    }

    function renderStaleProbeNotice(reportTiming) {
      document.getElementById('stale-probe-notice')?.remove()
      const age = staleProbeAge(reportTiming.textContent)
      if (!age) return
      const notice = document.createElement('p')
      notice.id = 'stale-probe-notice'
      notice.className = 'stale-probe-notice'
      notice.setAttribute('role', 'status')
      notice.innerHTML = `<span aria-hidden="true">⚠</span><span>Latest probe started <strong>${age}</strong>. Worker information may be out of date.</span>`
      reportTiming.after(notice)
    }

    function renderSource() {
      const repoUrl = `https://github.com/taskcluster/${repo}`
      const context = document.createElement('div')
      context.className = 'report-context'
      context.innerHTML = `<p class="source" id="source">` +
        `<span>Source code: <a href="${repoUrl}">GitHub</a></span>` +
        `<span>Downloads: <a href="${readmeUrl}">Current worker-pool report (Markdown)</a> · ` +
        `<a href="${workersUrl}">Current worker-pool data (JSON)</a> · ` +
        `<a href="${historyUrl}">Historical worker-pool data (JSON)</a></span></p>`

      const content = document.getElementById('content')
      const reportTiming = [...content.querySelectorAll('p')]
        .find(paragraph => paragraph.textContent.startsWith('Probe run started:'))
      const coverage = document.createElement(reportTiming ? 'span' : 'p')
      coverage.id = 'history-coverage'
      if (reportTiming) {
        renderStaleProbeNotice(reportTiming)
        const trailingText = reportTiming.lastChild
        const hasRevision = /\([a-f0-9]{9,40}(?:-dirty)?\)\s*$/.test(reportTiming.textContent)
        if (hasRevision && trailingText?.nodeType === Node.TEXT_NODE) {
          const closingParen = trailingText.splitText(trailingText.textContent.lastIndexOf(')'))
          reportTiming.insertBefore(coverage, closingParen)
          coverage.dataset.withRevision = 'true'
        } else reportTiming.append(coverage)
      }
      else {
        coverage.className = 'source'
        context.prepend(coverage)
      }

      const firstSection = content.querySelector('h2')
      if (firstSection) firstSection.before(context)
      else content.append(context)
    }

    function renderSourceUpdated(data) {
      const dates = Object.keys(data).sort()
      const coverage = document.getElementById('history-coverage')
      if (!coverage) return
      const summary = `${dates.length} snapshots from ${dates[0]} to ${dates[dates.length - 1]}`
      coverage.textContent = coverage.tagName === 'SPAN'
        ? coverage.dataset.withRevision === 'true' ? `, ${summary}` : ` (${summary})`
        : `History: ${summary}.`
    }

    async function loadReadme() {
      const text = await (await fetchOk(readmeUrl)).text()
      showdown.setFlavor('github');
      document.getElementById('content').innerHTML = (new showdown.Converter({
        ghCompatibleHeaderId: true,
        tables: true,
      })).makeHtml(text)
      // Markdown needs an absolute link on GitHub; the website has its own timeline.
      document.querySelectorAll(
        '#content a[href="https://taskcluster.github.io/mozilla-history/migration.html"]',
      ).forEach(link => { link.href = new URL('./migration.html', baseUrl).href })
    }

    function slugify(value) {
      return value
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '')
    }

    function storedTocPreference() {
      try {
        const value = window.localStorage.getItem(TOC_STORAGE_KEY)
        if (value === 'true') return true
        if (value === 'false') return false
        return null
      } catch (error) {
        return null
      }
    }

    function setTocCollapsed(collapsed, persist = true) {
      const layout = document.getElementById('report-layout')
      const toggle = document.getElementById('toc-toggle')
      const list = document.getElementById('toc-list')

      layout.classList.toggle('toc-collapsed', collapsed)
      list.hidden = collapsed
      toggle.setAttribute('aria-expanded', String(!collapsed))
      const action = collapsed ? 'Expand' : 'Collapse'
      toggle.setAttribute('aria-label', `${action} table of contents`)
      toggle.title = `${action} table of contents`

      if (!persist) return
      try {
        window.localStorage.setItem(TOC_STORAGE_KEY, String(collapsed))
      } catch (error) {
        // Storage can be unavailable in privacy modes; the control still works.
      }
    }

    function initTableOfContents() {
      const toggle = document.getElementById('toc-toggle')
      const preference = storedTocPreference()
      const collapsed = preference ?? window.matchMedia('(max-width: 900px)').matches
      setTocCollapsed(collapsed, false)
      toggle.addEventListener('click', () => {
        setTocCollapsed(toggle.getAttribute('aria-expanded') === 'true')
      })
    }

    function tableOfContentsLabel(heading, label) {
      if (heading.tagName === 'H1') return 'Overview'
      if (heading.tagName !== 'H3') return label
      if (label === 'Worker pools') return 'Pool details'
      if (label.startsWith('Worker pools by ')) {
        return `By ${label.slice('Worker pools by '.length)}`
      }
      return label
    }

    function buildTableOfContents() {
      const headings = document.querySelectorAll([
        '#content h1',
        '#content h2',
        '#content h3',
        '#history-content h2',
        '#history-content h3',
        '#graphs-content h2',
        '#graphs-content h3',
      ].join(', '))
      const toc = document.getElementById('toc-list')
      const usedIds = new Set()
      let sectionId = ''
      let sectionItem = null
      let subsectionList = null

      toc.replaceChildren()
      headings.forEach(heading => {
        heading.querySelector(':scope > .heading-permalink')?.remove()
        const label = heading.textContent.trim()
        const baseId = slugify(label)
        const candidateId = heading.tagName === 'H3' && sectionId
          ? `${sectionId}-${baseId}`
          : baseId
        let id = candidateId
        let suffix = 2
        while (usedIds.has(id)) {
          id = `${candidateId}-${suffix}`
          suffix += 1
        }
        usedIds.add(id)
        heading.id = id

        if (heading.tagName !== 'H1') {
          const permalink = document.createElement('a')
          permalink.className = 'heading-permalink'
          permalink.href = `#${id}`
          permalink.textContent = '#'
          permalink.setAttribute('aria-label', `Link to ${label}`)
          permalink.title = `Permalink to ${label}`
          heading.appendChild(permalink)
        }

        const item = document.createElement('li')
        const link = document.createElement('a')
        link.href = `#${id}`
        link.textContent = tableOfContentsLabel(heading, label)
        item.appendChild(link)

        if (heading.tagName === 'H1') {
          toc.appendChild(item)
          return
        }

        if (heading.tagName === 'H2') {
          sectionId = id
          sectionItem = item
          subsectionList = null
          toc.appendChild(item)
          return
        }

        if (!sectionItem) return
        if (!subsectionList) {
          subsectionList = document.createElement('ul')
          sectionItem.appendChild(subsectionList)
        }
        subsectionList.appendChild(item)
      })
    }

    function distinctVersions(data) {
      const versions = new Set()
      Object.values(data).forEach(snapshot => {
        Object.keys(snapshot.versions).forEach(version => versions.add(version))
      })
      return versions
    }

    function datesDescending(data) {
      const dates = Object.keys(data).sort((a, b) => b.localeCompare(a))
      const { days } = RANGES.find(r => r.id === rangeId)
      if (!Number.isFinite(days)) return dates
      const cutoff = new Date(dates[0])
      cutoff.setDate(cutoff.getDate() - days)
      const from = cutoff.toISOString().slice(0, 10)
      return dates.filter(date => date >= from)
    }

    // Shading is relative to the busiest cell in the same row, i.e. each date's
    // share of that week's pools, so a migration reads as a moving dark band.
    // Square root, because a plain ratio leaves everything but the dominant
    // version or two in the palest step.
    function heatClass(value, rowMax) {
      if (!(value > 0) || !(rowMax > 0)) return ''
      const step = Math.ceil(Math.sqrt(value / rowMax) * HEAT_STEPS)
      return ` class="tu-heat-${Math.min(Math.max(step, 1), HEAT_STEPS)}"`
    }

    function historyTable(data, dates, prop) {
      const seen = new Set()
      dates.forEach(date => Object.keys(data[date][prop]).forEach(k => seen.add(k)))

      let columns = [...seen].sort((a, b) => prop === 'versions'
        ? compareVersionsDescending(a, b)
        : a.localeCompare(b))
      let folded = []
      if (prop === 'versions' && !showAllVersions && columns.length > MAX_VERSION_COLUMNS) {
        // compareVersionsDescending sorts anything that is not a version number
        // (the "unknown" bucket) last; keep those, they are not versions.
        const isVersion = key => /^v?\d/i.test(key.trim())
        const cut = columns.filter(isVersion).slice(MAX_VERSION_COLUMNS)
        folded = cut
        columns = columns.filter(key => !cut.includes(key))
      }

      const valueAt = (date, key) => data[date][prop][key] || 0
      const foldedTotal = date => folded.reduce((sum, key) => sum + valueAt(date, key), 0)

      const foldedHeader = folded.length
        ? `<th title="${folded.join(', ')}">older (${folded.length})</th>`
        : ''

      const row = date => {
        const values = columns.map(k => valueAt(date, k))
        if (folded.length) values.push(foldedTotal(date))
        const rowMax = Math.max(...values)
        return `<tr><td>${date}</td>` +
          values.map(v => `<td${heatClass(v, rowMax)}>${v || '-'}</td>`).join('') +
          `</tr>`
      }

      return `<table><thead><tr><th>Date</th>` +
        columns.map(k => `<th>${k || 'unknown'}</th>`).join('') + foldedHeader +
        `</tr></thead><tbody>` +
        dates.map(row).join('') +
        `</tbody></table>`
    }

    function historyControls(data) {
      const total = distinctVersions(data).size
      const options = RANGES.map(r =>
        `<option value="${r.id}"${r.id === rangeId ? ' selected' : ''}>${r.label}</option>`).join('')
      return `<div class="controls">
        <label>Dates: <select id="history-range">${options}</select></label>
        <label><input type="checkbox" id="history-all-versions"${showAllVersions ? ' checked' : ''}>
          show all ${total} versions</label>
        <span class="hint">Cell shading shows each date's share of pools.</span>
      </div>`
    }

    function renderHistory() {
      const dates = datesDescending(history)
      document.getElementById('history-content').innerHTML = `<h2>History</h2>` +
        historyControls(history) +
        `<h3>Implementations</h3>` +
        historyTable(history, dates, 'implementations') +
        `<h3>Versions</h3>` +
        historyTable(history, dates, 'versions') +
        `<h3>Worker Migration</h3>
        <p>The <a href="./migration.html">worker migration timeline</a> shows the transition from
          docker-worker to generic-worker and generic-worker version adoption over time.</p>`

      document.getElementById('history-range').addEventListener('change', event => {
        rangeId = event.target.value
        renderHistory()
      })
      document.getElementById('history-all-versions').addEventListener('change', event => {
        showAllVersions = event.target.checked
        renderHistory()
        if (plotly) renderGraphs()
      })

      enhance(document.getElementById('history-content'))
      buildTableOfContents()
    }

    function renderGraphs() {
      const dates = Object.keys(history).sort()
      const lineTrace = (name, y, extra = {}) => ({
        x: dates,
        y,
        name,
        type: 'scatter',
        mode: 'lines',
        hovertemplate: '<b>%{fullData.name}</b><br>Date: %{x}<br>Worker pools: %{y}<extra></extra>',
        ...extra,
      })
      const implementationTraces = [
        ['Generic worker', 'generic-worker'],
        ['Docker worker', 'docker-worker'],
        ['Unknown', '']
      ].map(([name, implementation]) => lineTrace(
        name,
        dates.map(date => history[date].implementations[implementation] || 0),
      ))

      // get unique versions, most used first
      const allVersions = [... new Set(dates.map(date => Object.keys(history[date].versions)).flat())]
      const peak = version => Math.max(...dates.map(date => history[date].versions[version] || 0))
      const ranked = allVersions.sort((a, b) => peak(b) - peak(a))
      // A trace per version means a legend of well over a hundred entries, so
      // only the biggest are charted individually unless asked otherwise.
      const charted = showAllVersions ? ranked : ranked.slice(0, CHARTED_VERSIONS)
      const rest = showAllVersions ? [] : ranked.slice(CHARTED_VERSIONS)

      const versionTraces = charted.sort(compareVersionsDescending).map(version => lineTrace(
        version || 'unknown',
        dates.map(date => history[date].versions[version] || 0),
      ))
      if (rest.length) versionTraces.push(lineTrace(
        `other (${rest.length})`,
        dates.map(date => rest.reduce((sum, v) => sum + (history[date].versions[v] || 0), 0)),
        { line: { dash: 'dot', color: '#888' } },
      ))

      const layout = (title, legendTitle) => ({
        hovermode: 'closest',
        title,
        legend: { title: { text: legendTitle } },
        xaxis: { title: { text: 'Snapshot date' } },
        yaxis: { title: { text: 'Worker pools' }, rangemode: 'tozero' },
      })
      plotly.newPlot(
        'graph-implementations',
        implementationTraces,
        layout('Worker pools by implementation', 'Implementation'),
      )
      plotly.newPlot(
        'graph-versions',
        versionTraces,
        layout('Worker pools by version', 'Version'),
      )
    }

    // Plotly is over a megabyte, and the charts sit below the tables. Fetch it
    // only once the graphs are close to being looked at.
    function loadGraphsWhenVisible() {
      const graphs = document.getElementById('graphs-content')
      const observer = new IntersectionObserver(async (entries) => {
        if (!entries.some(entry => entry.isIntersecting)) return
        observer.disconnect()
        const status = document.getElementById('graph-status')
        try {
          await loadScript(plotlyUrl)
          plotly = window.Plotly
          status.remove()
          renderGraphs()
        } catch (error) {
          showError(status.parentNode, 'the graphs', error)
        }
      }, { rootMargin: '400px' })
      observer.observe(graphs)
    }

    function enhance(root) {
      decorateSortableTables(root)
      // sticky headers/first column, row & column hover highlighting, filters
      enhanceTables(root)
    }

    async function init() {
      // Each stage renders into its own container, so one failure must not
      // take the rest of the page with it.
      const stages = [
        ['the worker pool report', document.getElementById('content'), async () => {
          await loadReadme()
          renderSource()
          enhance(document.getElementById('content'))
        }],
        ['the history data', document.getElementById('history-content'), async () => {
          history = await (await fetchOk(historyUrl)).json()
          renderSourceUpdated(history)
          renderHistory()
          loadGraphsWhenVisible()
        }],
      ]
      for (const [what, container, run] of stages) {
        try {
          await run()
        } catch (error) {
          showError(container, what, error)
        }
      }
      buildTableOfContents()
    }

    initTableOfContents()
    init()
  </script>
</body>

</html>
