<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Worker Version Report</title>
</head>
<body>
  <p>Opening the worker version report with local data&hellip;</p>
  <script>
    const destination = new URL('./', window.location.href)
    destination.searchParams.set('local', '')
    destination.hash = window.location.hash
    window.location.replace(destination)
  </script>
  <noscript>
    <a href="./">Open the local worker version report</a>
  </noscript>
</body>
</html>
